# =====================================================================
#  주간보고 시스템 - 개발 / 올인원 구성 (DB + APP 한 호스트)
#
#    podman-compose up -d --build
#    podman-compose logs -f app
#    podman-compose down
#
#  ※ 운영 이관(DB 192.168.200.116 / APP 192.168.200.115)은
#     docker-compose.prod.yml 을 사용하세요.
# =====================================================================
services:

  # -------------------------------------------------------------- DB
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: wr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-weekly_report}
      POSTGRES_USER: ${DB_USER:-wruser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      TZ: Asia/Seoul
      # 한글 정렬/대소문자 처리를 위한 초기화 옵션
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - wr-pgdata:/var/lib/postgresql/data
      # 최초 기동 시 스키마 자동 적용 (:z = SELinux 대응)
      - ./db/init:/docker-entrypoint-initdb.d:ro,z
    ports:
      # 외부에서 직접 접속할 필요가 없으면 이 줄을 주석 처리하세요
      - "${DB_EXPOSE_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wruser} -d ${DB_NAME:-weekly_report}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [wr-net]

  # ------------------------------------------------------------- APP
  app:
    init: true
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/weekly-report:1.0
    container_name: wr-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_PORT: 8080
      # pasta 방식에서는 컨테이너가 기관 네트워크에 붙지 않으므로
      # DB 는 호스트에 열린 포트로 접속한다
      DB_HOST: ${APP_DB_HOST:-host.containers.internal}
      DB_PORT: ${APP_DB_PORT:-15432}
      DB_NAME: ${DB_NAME:-weekly_report}
      DB_USER: ${DB_USER:-wruser}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
      DB_SCHEMA: wr
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 을 .env 에 설정하세요}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-}
      SSL_KEY_FILE: ${SSL_KEY_FILE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-주간실적 보고 시스템}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      RESET_TOKEN_MINUTES: ${RESET_TOKEN_MINUTES:-30}
      RESET_FALLBACK: ${RESET_FALLBACK:-direct}
      RESET_DIRECT_MINUTES: ${RESET_DIRECT_MINUTES:-15}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SIGNUP_AUTO_APPROVE: ${SIGNUP_AUTO_APPROVE:-true}
      SIGNUP_ALLOWED_EMAIL_DOMAINS: ${SIGNUP_ALLOWED_EMAIL_DOMAINS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-관리자}
      TZ: Asia/Seoul
    volumes:
      - wr-uploads:/app/uploads
      - ./certs:/app/certs:ro,z
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 15s
    # pasta : 접속자의 실제 IP 가 그대로 전달된다.
    # 기본 방식(rootlessport)은 출발지 주소를 중계기 주소로 바꿔 버려
    # 활동 로그에 컨테이너 내부 주소만 남았다.
    network_mode: pasta

volumes:
  wr-pgdata:
  wr-uploads:

networks:
  wr-net:
    driver: bridge
