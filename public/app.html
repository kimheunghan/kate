<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주간보고 · 주간실적 보고 시스템</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css?v=__V__">
</head>
<body>

  <header class="topbar" id="topbar"></header>

  <div class="wrap">

    <!-- ============================================================ 탭 -->
    <div class="panel">
      <div class="tabs">
        <button data-tab="write" class="active">주간보고서 작성</button>
        <button data-tab="list">등록 내역 조회</button>
      </div>

      <!-- ------------------------------------------------- 작성 탭 -->
      <div class="body" id="tab-write">
        <div class="search-bar">
          <label class="sb-field sb-week" style="flex:1 1 340px">
            <span>보고 주차</span>
            <select id="sel-week"></select>
          </label>
          <button class="btn primary sb-btn" id="btn-load">검색</button>
          <!-- 기관은 검색줄 오른쪽 끝에 붙인다 -->
          <label class="sb-field sb-right" id="org-field" style="flex:0 0 auto">
            <span>기관</span>
            <!-- 보고서는 항상 본인 소속으로 저장되므로 기관명만 보여준다 -->
            <select id="sel-org" class="hidden"></select>
            <div id="sel-org-text" class="sb-static"></div>
          </label>
        </div>
        <div id="write-status"></div>
      </div>
    </div>

    <!-- ============================================ 보고서 편집 영역 -->
    <div class="panel" id="editor-panel">
      <header>
        <h2 id="editor-title">주간 추진실적</h2>
        <span id="editor-badge"></span>
        <div class="spacer"></div>
        <!-- Excel 양식 내려받기 : 지금은 감춰 둔다. 기능은 그대로라 hidden 만 떼면 다시 보인다. -->
        <button class="btn sm hidden" id="btn-excel-template">Excel 양식</button>
        <button class="btn sm primary" id="btn-excel-import">Excel 일괄등록</button>
        <input type="file" id="excel-file-input" accept=".xlsx" class="hidden">
      </header>

      <!-- 공용 편집 툴바: 현재 편집 중인 칸에 적용됩니다 -->
      <div id="shared-toolbar"></div>

      <!-- 왼쪽: 편집 도구 안내 / 오른쪽: 업무 추가·삭제 -->
      <div class="toolbar-hint">
        <span id="toolbar-hint-text"><span class="mark">※</span> 계획 또는 실적 칸을 클릭 시 위 편집 도구가 활성화됩니다.</span>
        <span class="row-ctl">
          <b>업무 추가 / 삭제</b>
          <button class="btn sm icon" id="btn-add-row" title="맨 아래에 업무 항목을 추가합니다">+</button>
          <button class="btn sm icon danger" id="btn-del-row" title="편집 중인 업무 항목을 삭제합니다">−</button>
        </span>
      </div>

      <div class="body">
        <div class="table-scroll">
          <table class="report-table">
            <colgroup>
              <col class="c-no"><col class="c-cell"><col class="c-cell"><col class="c-cell">
            </colgroup>
            <thead>
              <tr>
                <th>순번</th>
                <th id="th-plan">① 당초 계획</th>
                <th id="th-result">② 추진 실적</th>
                <th id="th-next">③ 향후 계획</th>
              </tr>
            </thead>
            <tbody id="items-body"></tbody>
          </table>
        </div>

        <label class="field mt16">
          <span>특이사항 / 비고 (선택)</span>
          <textarea id="note" rows="2" placeholder="이슈, 협조 요청사항 등을 입력하세요."></textarea>
        </label>
      </div>
    </div>

    <!-- ================================================ 증적자료 첨부 -->
    <div class="panel" id="files-panel">
      <header>
        <h2>증적자료 첨부 <span id="files-count" class="title-count"></span></h2>
        <span class="muted small">문서, 소스파일, 캡처 등 (실행파일은 zip 으로 압축해서 올려주세요)</span>
      </header>
      <div class="body">
        <div class="dropzone" id="dropzone">
          파일을 여기에 끌어다 놓거나 클릭해서 선택하세요
          <div class="small mt8" id="dz-hint"></div>
        </div>
        <input type="file" id="file-input" multiple class="hidden">
        <ul class="file-list" id="file-list"></ul>
      </div>
    </div>

    <!-- ==================================================== 저장 버튼 -->
    <div class="panel no-print" id="save-panel">
      <div class="body">
        <!-- 오른쪽 정렬, 주 동작(저장)을 맨 오른쪽에 둔다 -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end">
          <button class="btn" id="btn-print">인쇄 / PDF</button>
          <button class="btn" id="btn-export"
                  title="MS Word 문서로 내려받습니다">Word 다운로드</button>
          <button class="btn" id="btn-export-hwpx"
                  title="아래한글에서 바로 열리는 HWPX 문서로 내려받습니다">한글 다운로드</button>
          <button class="btn primary" id="btn-save">저장</button>
        </div>
      </div>
    </div>

    <!-- ================================================= 조회 탭 내용 -->
    <div class="panel hidden" id="tab-list">
      <header>
        <h2>등록 내역</h2>
        <span class="small muted" id="list-scope-note"></span>
        <div class="spacer"></div>
      </header>
      <div class="body">
        <div class="search-bar">
          <label class="sb-field" style="flex:2 1 340px">
            <span>주차</span>
            <select id="f-week"><option value="">전체</option></select>
          </label>
          <label class="sb-field" id="f-org-field" style="flex:1 1 220px">
            <span>기관</span>
            <select id="f-org"><option value="">전체</option></select>
          </label>
          <button class="btn primary sb-btn" id="btn-search">조회</button>
        </div>

        <div class="list-head">
          <h3 class="sec-title" id="list-count">보고서 목록</h3>
          <div class="list-tools">
            <span class="dl-note" id="dl-note"></span>
            <button class="btn sm dl-btn" id="btn-week-hwpx">
              <span class="dl-ico" aria-hidden="true">⤓</span>
              <span id="dl-label">전체 주차 ZIP 다운로드</span>
            </button>
            <div id="list-pager"></div>
          </div>
        </div>

        <div class="table-scroll">
          <table class="grid fixed">
            <thead>
              <tr>
                <th class="col-org" style="width:11%">기관</th>
                <th class="col-author" style="width:8%">참여인력</th>
                <th style="width:15%">주차</th>
                <th>내용 요약</th>
                <th class="center" style="width:7%">상태</th>
                <th class="center" style="width:5%">항목</th>
                <th class="center" style="width:5%">첨부</th>
                <th style="width:10%">최종수정</th>
                <th class="center" style="width:12%">상세보기 / 다운로드</th>
              </tr>
            </thead>
            <tbody id="list-body"></tbody>
          </table>
        </div>
        <div class="pager" id="list-pager-bottom"></div>
      </div>
    </div>

  </div>

  <div id="toast"></div>

  <script src="/js/api.js?v=__V__"></script>
  <script src="/js/editor.js?v=__V__"></script>
  <script src="/js/app.js?v=__V__"></script>
</body>
</html>
